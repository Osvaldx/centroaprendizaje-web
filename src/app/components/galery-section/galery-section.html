<section id="fotos" class="bg-[#dcebd4] py-16 overflow-hidden">
    <div class="w-full max-w-6xl mx-auto px-4">
      <div class="flex flex-col justify-center items-center text-center gap-2 mb-10">
        <h2 class="text-3xl font-bold text-gray-800">Nuestra Galería</h2>
        <p class="max-w-xl text-black/80">
          Una mirada al interior de nuestro instituto y al trabajo que realizamos junto a nuestros alumnos.
        </p>
      </div>
      <div class="relative w-full max-w-4xl mx-auto select-none">
        <div
          class="overflow-hidden rounded-2xl border-4 border-white shadow-lg bg-white aspect-[16/9] flex justify-center items-center"
        >
          <img
            [src]="images()[currentIndex()]"
            alt="Foto del centro"
            class="w-full h-full object-contain transition-all duration-700 ease-in-out"
            loading="lazy"
          />
        </div>
        <button
          (click)="prevImage()"
          class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/70 hover:bg-white text-gray-800 rounded-full px-4 py-2 shadow transition cursor-pointer active:bg-white"
        >
          ‹
        </button>
        <button
          (click)="nextImage()"
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/70 hover:bg-white text-gray-800 rounded-full px-4 py-2 shadow transition cursor-pointer active:bg-white"
        >
          ›
        </button>
        <div class="flex justify-center mt-4 gap-2">
          @for (img of images(); track $index) {
            <button
              (click)="goToImage($index)"
              class="w-3 h-3 rounded-full transition-all duration-300"
              [class.bg-gray-700]="currentIndex() === $index"
              [class.bg-gray-400]="currentIndex() !== $index"
            ></button>
          }
        </div>
      </div>
    </div>
  </section>
